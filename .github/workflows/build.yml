name: Build APK
on:
  push:
  workflow_dispatch:

concurrency:
  group: ghosthand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Run JVM regression tests
        run: gradle testDebugUnitTest --no-daemon -Dorg.gradle.jvmargs=-Xmx3g
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        with:
          name: GhostHand-APK
          path: app/build/outputs/apk/debug/app-debug.apk
