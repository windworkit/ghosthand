name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          GIT_SHA: ${{ github.sha }}
        run: gradle testDebugUnitTest assembleDebug --no-daemon -PgitSha=$GIT_SHA -Dorg.gradle.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        with:
          name: GhostHand-APK
          path: app/build/outputs/apk/debug/app-debug.apk
